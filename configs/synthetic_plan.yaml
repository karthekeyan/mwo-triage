# Plan for the ~2,500 synthetic train-pool work-order texts, approved
# 2026-11-19. Written by hand (Claude, in-session), no API calls.
#
# Three blocks:
#   topup     - top up today's thinnest real priority x route cells.
#   factory   - factory-equipment texts spread evenly across all 24 cells.
#   hard_case - boundary cases, one per tricky rulebook rule/section.
#
# scripts/synthetic_tools.py reads this file to hand out work ("next"),
# validate progress ("check"), and dedup the result ("dedup").

version: 1
seed: 42
rulebook_version: "1.3"
total_to_generate: 2464  # 864 (topup) + 1100 (factory) + 500 (hard_case)

priorities: [STOP_NOW, TODAY, PLAN, MONITOR]
routes: [MECHANICAL, ELECTRICAL, HYDRAULIC_PNEUMATIC, INSTRUMENTATION_CONTROLS, LUBRICATION, ESCALATE]

# ---------------------------------------------------------------- topup
# Counts existing real train-pool examples already in real_labelled.jsonl
# for each cell (from the priority x route cross-table), tops each up to
# its target. to_generate = target - existing_real.
topup:
  description: >
    Thin priority/route cells in the real train pool, topped up to a
    target count. Write plain, realistic maintenance texts for these
    cells -- no fixed equipment list, use whatever equipment fits.
  total_to_generate: 864
  cells:
    - priority: STOP_NOW
      route: LUBRICATION
      existing_real: 1
      target: 40  # lowered from 80 on review (chunk 1 was too templated on this cell)
      to_generate: 39
    - priority: STOP_NOW
      route: ESCALATE
      existing_real: 40
      target: 100
      to_generate: 60
    - priority: MONITOR
      route: ESCALATE
      existing_real: 57
      target: 100
      to_generate: 43
    - priority: STOP_NOW
      route: INSTRUMENTATION_CONTROLS
      existing_real: 26
      target: 150
      to_generate: 124
    - priority: STOP_NOW
      route: HYDRAULIC_PNEUMATIC
      existing_real: 48
      target: 150
      to_generate: 102
    - priority: STOP_NOW
      route: ELECTRICAL
      existing_real: 66
      target: 150
      to_generate: 84
    - priority: MONITOR
      route: INSTRUMENTATION_CONTROLS
      existing_real: 13
      target: 150
      to_generate: 137
    - priority: MONITOR
      route: LUBRICATION
      existing_real: 46
      target: 150
      to_generate: 104
    - priority: MONITOR
      route: ELECTRICAL
      existing_real: 60
      target: 150
      to_generate: 90
    - priority: MONITOR
      route: HYDRAULIC_PNEUMATIC
      existing_real: 69
      target: 150
      to_generate: 81

# ---------------------------------------------------------------- factory
# Factory-equipment texts (CNC, presses, robots, conveyors, compressors,
# paint shops, ...), spread roughly evenly across all 24 priority x route
# cells regardless of current real counts, so the model sees this
# equipment family under every label combination.
factory:
  description: >
    Factory/plant equipment texts, ~46 per cell across all 24 cells
    (20 cells at 46, 4 at 45, to total 1100). Cycle through the equipment
    list for variety within a cell rather than reusing one item.
  total_to_generate: 1100
  equipment:
    - CNC lathe
    - vertical machining centre
    - hydraulic press
    - stamping press
    - injection moulding machine
    - welding robot
    - robot cell
    - belt conveyor
    - AGV
    - air compressor
    - chiller
    - cooling tower
    - paint booth
    - curing oven
    - furnace
    - die casting machine
    - EOT crane
    - forklift
    - DG set
    - MCC panel
    - transformer
    - centrifugal pump
    - gearbox
    - packaging machine
  cells:
    - {priority: STOP_NOW, route: MECHANICAL, to_generate: 46}
    - {priority: STOP_NOW, route: ELECTRICAL, to_generate: 46}
    - {priority: STOP_NOW, route: HYDRAULIC_PNEUMATIC, to_generate: 46}
    - {priority: STOP_NOW, route: INSTRUMENTATION_CONTROLS, to_generate: 46}
    - {priority: STOP_NOW, route: LUBRICATION, to_generate: 46}
    - {priority: STOP_NOW, route: ESCALATE, to_generate: 46}
    - {priority: TODAY, route: MECHANICAL, to_generate: 46}
    - {priority: TODAY, route: ELECTRICAL, to_generate: 46}
    - {priority: TODAY, route: HYDRAULIC_PNEUMATIC, to_generate: 46}
    - {priority: TODAY, route: INSTRUMENTATION_CONTROLS, to_generate: 46}
    - {priority: TODAY, route: LUBRICATION, to_generate: 46}
    - {priority: TODAY, route: ESCALATE, to_generate: 46}
    - {priority: PLAN, route: MECHANICAL, to_generate: 46}
    - {priority: PLAN, route: ELECTRICAL, to_generate: 46}
    - {priority: PLAN, route: HYDRAULIC_PNEUMATIC, to_generate: 46}
    - {priority: PLAN, route: INSTRUMENTATION_CONTROLS, to_generate: 46}
    - {priority: PLAN, route: LUBRICATION, to_generate: 46}
    - {priority: PLAN, route: ESCALATE, to_generate: 46}
    - {priority: MONITOR, route: MECHANICAL, to_generate: 46}
    - {priority: MONITOR, route: ELECTRICAL, to_generate: 46}
    - {priority: MONITOR, route: HYDRAULIC_PNEUMATIC, to_generate: 45}
    - {priority: MONITOR, route: INSTRUMENTATION_CONTROLS, to_generate: 45}
    - {priority: MONITOR, route: LUBRICATION, to_generate: 45}
    - {priority: MONITOR, route: ESCALATE, to_generate: 45}

# -------------------------------------------------------------- hard_case
# One slot group per tricky rulebook rule, demonstrating the boundary the
# rule draws. Each text should still get a real target_priority and
# target_route reflecting the correct side of the boundary -- there is no
# single fixed cell per theme, since the point is the contrast.
hard_case:
  description: >
    Hard cases split evenly across 8 rulebook themes (4 at 63, 4 at 62,
    to total 500). Half of each theme's examples should land on each side
    of the boundary the theme is testing.
  total_to_generate: 500
  themes:
    - name: leak_location
      rule: TB6
      to_generate: 63
      note: Leak on a hot surface/spraying/people area (STOP_NOW) vs a plain steady leak (TODAY).
    - name: faulty_reading_vs_real_fault
      rule: TB4
      to_generate: 63
      note: Sensor/gauge reading wrong, erratic or missing (INSTRUMENTATION_CONTROLS) vs a believed real-fault reading (route by component).
    - name: lube_job_vs_leak_repair
      rule: TB5
      to_generate: 63
      note: Adding/changing lubricant or a lube-system fault (LUBRICATION) vs a seal/gasket/hose leak needing repair (owner team).
    - name: named_part_vs_escalate
      rule: section_5
      to_generate: 63
      note: A specific named component routes to its owner team even with unknown cause, vs a whole machine/major assembly with an ambiguous symptom (ESCALATE).
    - name: damaged_vs_worn
      rule: P2_P3
      to_generate: 62
      note: Broken/damaged/cracked/u-s (TODAY) vs worn/due-for-replacement/routine (PLAN).
    - name: missing_functional_part_vs_cover
      rule: P2_P3
      to_generate: 62
      note: A missing/loose functional part on a working component (TODAY) vs a missing/loose non-functional cover/trim/label (PLAN).
    - name: urgency_words_ignored
      rule: section_2
      to_generate: 62
      note: Urgency language ("URGENT", "ASAP", "!!!") on an otherwise minor defect -- priority follows the described condition, not the urgency words.
    - name: calibration_vs_mechanical_adjustment
      rule: TB8
      to_generate: 62
      note: Calibrating/programming/setting a sensor, controller or electronic brake control (INSTRUMENTATION_CONTROLS) vs a purely mechanical adjustment (owner team, usually MECHANICAL).

# ------------------------------------------------------------------ style
style:
  word_count_min: 3
  word_count_max: 15
  # Length targets added 2026-11-20 after the first 501-text batch came out
  # too wordy (mean 8.92, median 9 words) against the real train-pool
  # texts (mean 5.38, median 5.0) and had to be compressed after the fact.
  # Write to these targets up front instead:
  length_targets:
    overall_median_words: "5-6"
    overall_mean_words_max: 6.5
    per_priority_mean_within_words_of_real: 1.5
    per_priority_real_means: {STOP_NOW: 5.41, TODAY: 5.23, PLAN: 5.40, MONITOR: 6.13}
  messy_fraction: 0.70
  clean_fraction: 0.30
  messy_features:
    - abbreviations from docs/labelling-rulebook.md section 7 (c/o, u/s, o/s, hyd, elec, lhs/rhs, fr/rr, brg, eng, p/m, insp, repl/rplc, lkg, temp, vib, ad)
    - ALL CAPS or inconsistent casing
    - typos and dropped words, as in real shorthand work orders
    - made-up asset codes shaped like the real ones (two letters + three digits, e.g. "KT402"), never real IDs
  clean_features:
    - full words, normal capitalisation, no abbreviations

# ------------------------------------------------------------ generation
# Rules added on review of chunk 1 (too templated, one cell per chunk,
# style too clean) -- apply these when writing every chunk from here on.
generation_rules:
  - >-
    No single trigger phrase or sentence pattern (e.g. "X dry, burning
    smell/smoke", "X bearing temp rising, grinding") may appear in more
    than 5 texts within any one chunk shown for review.
  - >-
    The next command serves slots in a seeded shuffled order (see
    scripts/synthetic_tools.py), so a chunk mixes cells, blocks and
    themes rather than draining one cell at a time.
  - >-
    For STOP_NOW x LUBRICATION specifically, spread the STOP_NOW trigger
    across four kinds, not just one -- a line/machine stopped by a lube
    system failure; a repeated low-lube-pressure or low-oil-level trip;
    rising temperature from oil/grease starvation (with grinding or
    knocking); and smoke/burning smell from a dry-running, unlubricated
    part. Smoke/burning smell is at most a quarter of this cell's texts.
  - >-
    Smoke and burning smell must also appear as STOP_NOW triggers on
    other routes across the dataset, especially ELECTRICAL (e.g. a
    burning smell from a motor winding or a smoking cable) -- they are
    general P1 safety triggers (rulebook section 3), not a lubrication
    shortcut, and the route must still be decided by the repair target.
  - >-
    Actually hit the 70% messy / 30% clean split per chunk: use the
    rulebook section 7 abbreviations, ALL CAPS or mixed casing, dropped
    words, small typos, and made-up two-letter+three-digit asset codes --
    and vary where the asset code sits in the sentence (start, middle, or
    end), since real texts don't always lead with it.
  - >-
    Added on review after chunk 10 (MONITOR texts had templated on
    "a touch low/high", "logged" and "keeping an eye"): no closing phrase
    for a MONITOR text may appear in more than 5 MONITOR texts across the
    whole dataset, not just within a chunk. Vary the MONITOR close across
    forms such as: an oil sample, thermography scan or vibration route
    result marked "trend" or "watch only"; an inspection finding within
    tolerance or within spec; "due a look/recheck at the next PM"; an
    operator or crew noticing a minor change in passing; a reading
    slightly/somewhat/marginally off but still within normal limits or
    range; or a request to observe on the next run or shift. Before
    saving a chunk, check the running MONITOR phrase counts across
    data/interim/synthetic_raw.jsonl, not just the new chunk.
  - >-
    Added 2026-11-20 after a compression pass was needed on the first 501
    texts: write fragment style like the real data from the start --
    drop articles and connectors, use the rulebook's abbreviations --
    and keep each text close to style.length_targets (overall median
    5-6 words, overall mean at most 6.5, and each priority's mean within
    about 1.5 words of its real-data mean above). Always keep the fact
    that decides the label (e.g. "onto hot exhaust", "line down",
    "spraying", "u/s"); if a text can't be shortened without losing that
    fact, leave it longer rather than drop the fact. Before saving a
    chunk, run scripts/style_audit.py and check the new chunk's mean and
    per-priority means against these targets, not just the whole file's.
  - >-
    Added 2026-11-20 after the same compression pass protected the
    priority-deciding word (e.g. "spraying", "u/s") in a text but dropped
    the route-deciding word, leaving the route unrecoverable from the
    text alone (e.g. "Main hyd pump failed, press line stopped" ->
    "Main pump failed, press line stopped" loses "hyd"): keep both the
    priority-deciding word and the route-deciding word in every text --
    a rulebook section 4 cue for the route (hyd/hydraulic, air/pneumatic,
    elec/electrical, motor, wiring/cable, breaker, sensor, gauge,
    transmitter, PLC, HMI, lube/grease/oiler, bearing, belt, seal, or an
    equally specific named component such as accumulator/valve/cylinder/
    contactor/starter/isolator) as well as the priority cue. A bare
    "pump"/"line"/"motor"/"seal" alone is not enough once the more
    specific word next to it has been cut for length.
  - >-
    Added 2026-11-20 after a 30-text sample review found a coolant/water
    line labelled HYDRAULIC_PNEUMATIC and spraying/bursting alone treated
    as a P1 trigger for it: coolant, water and steam are not hydraulic or
    pneumatic fluid (rulebook section 4's HYDRAULIC_PNEUMATIC row is
    hydraulic oil and compressed air only), so a coolant/water/steam line
    spraying or bursting does NOT by itself trigger STOP_NOW and does NOT
    route HYDRAULIC_PNEUMATIC -- route it by the component (usually
    MECHANICAL) and give it TODAY unless the leak is also onto a hot
    surface, an ignition source, or a walkway/area where people are (the
    generic leak-location trigger, which applies to any fluid).
  - >-
    Added 2026-11-20, same review: a discipline-specific symptom (an
    "elec fault", a "hyd fault"/leak, a named sensor/gauge/PLC fault,
    etc.) routes to that discipline (ELECTRICAL, HYDRAULIC_PNEUMATIC,
    INSTRUMENTATION_CONTROLS, ...), never ESCALATE -- rulebook section 5
    only escalates when the text gives NO component and no
    discipline-specific symptom, or names a whole machine/major assembly
    with a symptom that could equally be any discipline. Naming the
    discipline directly (elec/hyd/a specific sensor or component) is
    already more specific than that and must route there.
  - >-
    Reminder (already in force, repeated here after the same review):
    (a) no label-revealing qualifiers -- never write words that name or
    imply the target priority/route directly (e.g. "safety issue",
    "low priority", "electrical problem"); describe the condition only,
    per rulebook section 2. (b) no MONITOR closing phrase may repeat more
    than 5 times across the whole file (see the chunk-10 rule above) --
    check data/interim/synthetic_raw.jsonl's running phrase counts before
    saving each new chunk, not just the new chunk's own phrases.
